name: invispay
description: Replicated Fintech App - InvisPay
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0

  # Navigation
  go_router: ^17.0.1

  # Forms
  flutter_form_builder: ^10.2.0
  form_builder_validators: ^11.2.0

  # Firebase
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  firebase_storage: ^13.0.6
  google_sign_in: ^7.2.0
  
  # UI/UX
  google_fonts: ^8.0.0
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  phosphor_flutter: ^2.0.0 # High quality icons

  # Utils
  intl: ^0.20.2
  uuid: ^4.2.2

  cupertino_icons: ^1.0.8
  file_picker: ^10.3.8
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.4
  image_picker: ^1.1.2
  image_cropper: ^8.0.2
  qr_flutter: ^4.1.0
  share_plus: ^10.1.4
  screenshot: ^3.0.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.0+1
  build_runner: ^2.4.8
  custom_lint: ^0.8.1
  riverpod_lint: ^3.1.0

flutter:
  uses-material-design: true





